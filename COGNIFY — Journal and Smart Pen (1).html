<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>COGNIFY — Journal and Smart Pen</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--ink:#1E1C1A;--muted:#2A2724;--chip:rgba(255,252,246,.72);--edge:rgba(43,41,38,.28);--focus:#8A6D1F;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--chip:rgba(255,252,246,.8);--focus:#7A5C12}}
:root[data-theme="dark"]{--chip:rgba(255,252,246,.8);--focus:#7A5C12}
html,body{height:100%;margin:0;background:#8F8E8B;color:var(--ink);font-family:"Jost","Helvetica Neue",Arial,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.brand{position:fixed;left:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 22px) 26px 0;pointer-events:none}
.brand h1{margin:0;font-weight:300;font-size:20px;letter-spacing:.34em}
.brand p{margin:6px 0 0;font-weight:300;font-size:13px;color:var(--muted);letter-spacing:.04em}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 26px calc(env(safe-area-inset-bottom,0px) + 20px);pointer-events:none}
.hint{margin:0;font-size:13px;font-weight:300;color:var(--muted);max-width:34ch;line-height:1.5}
.sw{display:flex;gap:10px;pointer-events:auto;background:var(--chip);padding:8px 10px;border-radius:999px;border:1px solid var(--edge)}
.sw button{width:26px;height:26px;border-radius:50%;border:1px solid var(--edge);cursor:pointer;padding:0}
.sw button[aria-pressed="true"]{outline:2px solid var(--focus);outline-offset:2px}
.sw button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#fallback{position:fixed;inset:0;display:grid;place-items:center;font-size:15px}
@media (max-width:560px){.bar{flex-direction:column-reverse;align-items:flex-start}}
.nav{position:fixed;right:0;top:0;display:flex;gap:6px;padding:calc(env(safe-area-inset-top,0px) + 18px) 22px 0}
.nav button{font:400 13px "Jost","Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--chip);border:1px solid var(--edge);border-radius:999px;padding:7px 14px;cursor:pointer}
.nav button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (max-width:560px){.nav{top:46px;left:0;right:auto;padding:calc(env(safe-area-inset-top,0px) + 30px) 26px 0}}
</style>
</head>
<body>
<div class="brand"><h1>COGNIFY</h1><p>Journal and smart pen</p><p id="st"></p></div>
<div class="bar">
  <p class="hint" id="hint">Drag to orbit. Hover the pen to spin the gold ring and flip through the app. Click the phone to move on. Click the LED to switch it off.</p>
  <div class="sw" role="group" aria-label="Cover colour">
    <button id="sw-charcoal" style="background:#2B2926" aria-pressed="true" aria-label="Warm charcoal cover" title="Warm charcoal"></button>
    <button id="sw-navy" style="background:#1B2433" aria-pressed="false" aria-label="Deep navy cover" title="Deep navy"></button>
  </div>
</div>
<nav class="nav" aria-label="Camera"><button id="f-all">Overview</button><button id="f-journal">Journal</button><button id="f-pen">Pen</button><button id="f-app">App</button></nav>
<div id="fallback" hidden>This scene needs WebGL, which your browser has turned off.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
window.addEventListener('error',function(e){var st=document.getElementById('st');if(st){st.textContent='Error: '+e.message;}});
var BG=0x8F8E8B, renderer;
var ANGLE=160,T=(180-ANGLE)*Math.PI/180,LIFT=105*Math.sin(T); // products propped: surface-to-table angle of 160 degrees
try{renderer=new THREE.WebGLRenderer({antialias:true});}catch(e){document.getElementById('fallback').hidden=false;return;}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=0.92;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

var scene=new THREE.Scene();
scene.background=new THREE.Color(BG);
scene.fog=new THREE.Fog(BG,700,1500);
var camera=new THREE.PerspectiveCamera(28,innerWidth/innerHeight,10,3000);
var target=new THREE.Vector3(45,30,20);
var dir=new THREE.Vector3(-70,430,300).normalize();
function baseDist(){var a=innerWidth/innerHeight;return 620*Math.max(1,1.15/a);}

// studio environment so the metals have something soft to reflect
(function(){
  var env=new THREE.Scene();
  var dome=new THREE.Mesh(new THREE.SphereGeometry(500,32,16),new THREE.MeshBasicMaterial({color:0x8d867b,side:THREE.BackSide}));
  env.add(dome);
  function box(w,h,x,y,z,c,s){var m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color(c).multiplyScalar(s),side:THREE.DoubleSide}));m.position.set(x,y,z);m.lookAt(0,0,0);env.add(m);}
  box(260,160,-260,260,160,0xfff2e0,5);
  box(160,200,260,150,-120,0xe8eeff,2.2);
  box(420,120,0,330,-40,0xffffff,2.5);
  var pm=new THREE.PMREMGenerator(renderer);
  scene.environment=pm.fromScene(env,0.04).texture;
  pm.dispose();
})();

scene.add(new THREE.HemisphereLight(0xfff8ee,0xd8cfc2,0.45));
var key=new THREE.DirectionalLight(0xfff1de,1.5);
key.position.set(-180,320,160);key.castShadow=true;
key.shadow.mapSize.set(2048,2048);
var sc=key.shadow.camera;sc.left=-260;sc.right=260;sc.top=260;sc.bottom=-260;sc.near=50;sc.far=800;
key.shadow.bias=-0.0004;key.shadow.normalBias=0.4;
scene.add(key);
var fill=new THREE.DirectionalLight(0xeaf0ff,0.45);fill.position.set(220,160,120);scene.add(fill);
var rim=new THREE.DirectionalLight(0xffffff,0.6);rim.position.set(60,120,-300);scene.add(rim);

var floor=new THREE.Mesh(new THREE.PlaneGeometry(3000,3000),new THREE.ShadowMaterial({color:0x14120F,opacity:0.32}));
floor.rotation.x=-Math.PI/2;floor.position.y=-0.02;floor.receiveShadow=true;scene.add(floor);

function canvasTex(w,h,fn,srgb){
  var c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);
  var t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;
  if(srgb)t.encoding=THREE.sRGBEncoding;return t;
}
function rrShape(w,d,r){
  var s=new THREE.Shape(),x=-w/2,y=-d/2;
  s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);
  s.lineTo(x+w,y+d-r);s.quadraticCurveTo(x+w,y+d,x+w-r,y+d);
  s.lineTo(x+r,y+d);s.quadraticCurveTo(x,y+d,x,y+d-r);
  s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);return s;
}
function slab(w,d,h,r,b,mat){
  var g=new THREE.ExtrudeGeometry(rrShape(w-2*b,d-2*b,r),{depth:h-2*b,bevelEnabled:true,bevelThickness:b,bevelSize:b,bevelSegments:3,curveSegments:10});
  g.rotateX(-Math.PI/2);g.translate(0,b,0);
  var m=new THREE.Mesh(g,mat);m.castShadow=true;m.receiveShadow=true;return m;
}

// ---------- Journal (A5: 148 x 210 x 18 mm) ----------
var journal=new THREE.Group();scene.add(journal);
var grain=canvasTex(256,256,function(x,w,h){
  x.fillStyle='#808080';x.fillRect(0,0,w,h);
  for(var i=0;i<9000;i++){var g=40+Math.random()*180|0;x.fillStyle='rgb('+g+','+g+','+g+')';x.fillRect(Math.random()*w,Math.random()*h,1.5,1.5);}
});
grain.repeat.set(0.09,0.09);
var coverMat=new THREE.MeshStandardMaterial({color:0x2B2926,roughness:0.9,metalness:0,bumpMap:grain,bumpScale:1.4,envMapIntensity:0.5});
var back=slab(148,210,3,5,0.5,coverMat);journal.add(back);
var front=slab(148,210,3,5,0.5,coverMat);front.position.y=15;journal.add(front);
var spine=slab(4,210,18,1.2,0.5,coverMat);spine.position.x=-72;journal.add(spine);

var paperTex=canvasTex(32,32,function(x,w,h){
  x.fillStyle='#FDFBF7';x.fillRect(0,0,w,h);
  for(var i=0;i<8;i++){x.fillStyle='rgba(150,130,100,'+(0.14+Math.random()*0.16)+')';x.fillRect(0,i*4+1,w,1);}
},true);
paperTex.repeat.set(1,3);
var pages=new THREE.Mesh(new THREE.BoxGeometry(141,12,204),new THREE.MeshStandardMaterial({color:0xFFFFFF,map:paperTex,roughness:0.95,metalness:0,envMapIntensity:0.3}));
pages.position.set(0.5,9,0);pages.castShadow=true;pages.receiveShadow=true;journal.add(pages);

// elastic band, wrapped over the front and round the back
var elMat=new THREE.MeshStandardMaterial({color:0x1A1918,roughness:0.85,metalness:0,envMapIntensity:0.3});
function elBox(w,h,d,x,y,z){var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),elMat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;journal.add(m);}
elBox(6,0.8,211.6,52,18.4,0);
elBox(6,18.8,0.8,52,9.4,105.4);
elBox(6,18.8,0.8,52,9.4,-105.4);
elBox(6,0.8,211.6,52,0.4,0);

// blind-debossed logo
var logoCanvas={};
function drawLogo(){
  var tex=canvasTex(1024,256,function(x,w,h){
    var word='COGNIFY',fs=118,sp=34;
    x.font='300 '+fs+'px Jost, "Helvetica Neue", Arial, sans-serif';x.textBaseline='middle';
    var tot=-sp,i;for(i=0;i<word.length;i++){tot+=x.measureText(word[i]).width+sp;}
    var passes=[[2.2,3,'rgba(190,175,150,0.16)'],[-1,-1.4,'rgba(0,0,0,0.6)']];
    passes.forEach(function(p){var px=(w-tot)/2+p[0];x.fillStyle=p[2];
      for(i=0;i<word.length;i++){x.fillText(word[i],px,h/2+p[1]);px+=x.measureText(word[i]).width+sp;}});
  },true);
  tex.wrapS=tex.wrapT=THREE.ClampToEdgeWrapping;
  var m=new THREE.Mesh(new THREE.PlaneGeometry(80,20),new THREE.MeshStandardMaterial({map:tex,transparent:true,roughness:1,metalness:0,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2}));
  m.rotation.x=-Math.PI/2;m.position.set(-4,18.03,0);journal.add(m);
}
if(document.fonts&&document.fonts.load){document.fonts.load('300 118px Jost').then(drawLogo,drawLogo);}else{drawLogo();}

// ribbon marker draping off the foot edge onto the table
(function(){
  function W(x,y,z){return new THREE.Vector3(x,y*Math.cos(T)-z*Math.sin(T)+LIFT,y*Math.sin(T)+z*Math.cos(T));}
  var curve=new THREE.CatmullRomCurve3([W(-35,14.6,90),W(-35,14.5,104),new THREE.Vector3(-34.7,9,107.5),new THREE.Vector3(-34.3,3.5,111),new THREE.Vector3(-33.5,0.3,117),new THREE.Vector3(-32,0.25,126),new THREE.Vector3(-28,0.25,140),new THREE.Vector3(-22,0.25,154)]);
  var pts=curve.getPoints(70),pos=[],idx=[],i;
  for(i=0;i<pts.length;i++){var p=pts[i];pos.push(p.x-2.5,p.y,p.z,p.x+2.5,p.y,p.z);}
  for(i=0;i<pts.length-1;i++){var a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2);}
  var g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();
  var m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0xB89B72,roughness:0.42,metalness:0.1,side:THREE.DoubleSide}));
  m.castShadow=true;m.receiveShadow=true;scene.add(m);
})();

// ---------- Smart pen (145 mm long, axis along local x) ----------
var pen=new THREE.Group();journal.parent.add(pen);
function lathe(pts,mat){
  var g=new THREE.LatheGeometry(pts.map(function(p){return new THREE.Vector2(p[0],p[1]);}),64);
  g.rotateZ(-Math.PI/2);g.translate(-72.5,0,0);
  var m=new THREE.Mesh(g,mat);m.castShadow=true;m.receiveShadow=true;return m;
}
function metal(c,r,e){return new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:1,envMapIntensity:e||1,side:THREE.DoubleSide});}
var tipPts=[],i;for(i=0;i<=10;i++){tipPts.push([i===0?0.01:5*Math.pow(i/10,0.75),20*i/10]);}
pen.add(lathe(tipPts,metal(0xB9BCC0,0.25)));
pen.add(lathe([[5.0,20],[5.2,20.5],[5.2,57.5],[5.0,58]],metal(0x2E3033,0.55)));
pen.add(lathe([[4.5,56],[4.5,72]],new THREE.MeshStandardMaterial({color:0x121212,roughness:0.8,metalness:0,side:THREE.DoubleSide})));
pen.add(lathe([[5.0,68.5],[5.5,69],[5.5,138],[5.3,141],[4.6,143.5],[3.2,144.7],[0.01,145]],metal(0x3B3D40,0.42)));
var ring=new THREE.Group();pen.add(ring);
ring.add(lathe([[4.6,58.5],[5.6,58.5],[6,59],[6,67],[5.6,67.5],[4.6,67.5]],metal(0xD6B04A,0.14,1.5)));
var dotMat=new THREE.MeshStandardMaterial({color:0x6B4F10,roughness:0.5,metalness:1});
for(i=0;i<4;i++){
  var a=(45+90*i)*Math.PI/180,d=new THREE.Mesh(new THREE.SphereGeometry(0.5,16,12),dotMat);
  d.position.set(-9.5,5.85*Math.cos(a),5.85*Math.sin(a));ring.add(d);
}
// LED
var ledMat=new THREE.MeshBasicMaterial({color:0xFFE6BD,toneMapped:false});
var led=new THREE.Mesh(new THREE.BoxGeometry(6,0.35,1),ledMat);led.position.set(40,5.45,0);pen.add(led);
var gc=canvasTex(64,64,function(x,w,h){var g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,226,170,0.95)');g.addColorStop(0.35,'rgba(255,214,150,0.35)');g.addColorStop(1,'rgba(255,200,130,0)');x.fillStyle=g;x.fillRect(0,0,w,h);},true);
var glow=new THREE.Sprite(new THREE.SpriteMaterial({map:gc,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}));
glow.position.set(40,8,0);glow.scale.set(14,14,1);pen.add(glow);
var ledLight=new THREE.PointLight(0xFFD9A0,0.35,45);ledLight.position.set(40,9,0);pen.add(ledLight);
var ledHit=new THREE.Mesh(new THREE.SphereGeometry(4,12,8),new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false}));
ledHit.position.set(40,6,0);pen.add(ledHit);
pen.position.set(-12,24.05,0);pen.rotation.y=0.7;


// ---------- iPhone 18 Pro Max (78 x 163.4 x 8.8 mm) with the app walkthrough ----------
var phoneRoot=new THREE.Group();phoneRoot.position.set(168,0,2);phoneRoot.rotation.y=-0.2;phoneRoot.scale.setScalar(1.3);scene.add(phoneRoot);
var phone=new THREE.Group();phoneRoot.add(phone);
phone.add(slab(78,163.4,8.8,11,1.4,new THREE.MeshStandardMaterial({color:0x1b1c1e,roughness:0.38,metalness:1,envMapIntensity:1.1})));
function flatShape(w,h,r,y,z,mat,fixUV){
  var g=new THREE.ShapeGeometry(rrShape(w,h,r),24);
  if(fixUV){var uv=g.attributes.uv,ps=g.attributes.position;for(var q=0;q<ps.count;q++){uv.setXY(q,(ps.getX(q)+w/2)/w,(ps.getY(q)+h/2)/h);}}
  g.rotateX(-Math.PI/2);var m=new THREE.Mesh(g,mat);m.position.set(0,y,z);phone.add(m);return m;
}
var black=new THREE.MeshBasicMaterial({color:0x000000});
flatShape(76.4,162,10.4,8.83,0,black);
var screenMat=new THREE.MeshBasicMaterial({color:0xffffff,toneMapped:false});
var screen=flatShape(74.6,160.2,9.4,8.86,0,screenMat,true);
flatShape(22,6.4,3.2,8.9,-72.6,black);
var btnMat=new THREE.MeshStandardMaterial({color:0x2a2b2e,roughness:0.4,metalness:1});
[[-39.3,-52,6],[-39.3,-33,10],[-39.3,-17,10],[39.3,-25,16],[39.3,22,5]].forEach(function(b){
  var m=new THREE.Mesh(new THREE.BoxGeometry(0.9,2.4,b[2]),btnMat);m.position.set(b[0],5.2,b[1]);phone.add(m);
});
var scr=document.createElement('canvas');scr.width=1024;scr.height=2048;
var sctx=scr.getContext('2d');
var scrTex=new THREE.CanvasTexture(scr);scrTex.encoding=THREE.sRGBEncoding;scrTex.generateMipmaps=false;scrTex.minFilter=THREE.LinearFilter;scrTex.magFilter=THREE.LinearFilter;
screenMat.map=scrTex;screenMat.needsUpdate=true;
function spaced(c,txt,x,y,ls,center){
  var w=-ls,i;for(i=0;i<txt.length;i++){w+=c.measureText(txt[i]).width+ls;}
  var px=center?x-w/2:x;for(i=0;i<txt.length;i++){c.fillText(txt[i],px,y);px+=c.measureText(txt[i]).width+ls;}
}
function rr(c,x,y,w,h,r,fill){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();c.fillStyle=fill;c.fill();}

  if(tween<1){tween=Math.min(1,tween+dt/0.45);coverMat.color.copy(from).lerp(to,tween);elMat.color.copy(fromE).lerp(toE,tween);}

  if(cur>0){ringAcc+=spin*dt;if(ringAcc>6.2832){ringAcc=0;next();}}
  var tk=Math.min(1,dt*6);phone.rotation.x+=(tiltT.x-phone.rotation.x)*tk;phone.rotation.z+=(tiltT.z-phone.rotation.z)*tk;
  
  fade=Math.min(1,fade+dt*3);screenMat.color.setScalar(0.4+0.6*fade);
  if(fly){fly.k=Math.min(1,fly.k+dt/fly.d);var fe=fly.k<0.5?4*fly.k*fly.k*fly.k:1-Math.pow(-2*fly.k+2,3)/2;
    camera.position.lerpVectors(fly.p0,fly.p1,fe);controls.target.lerpVectors(fly.t0,fly.t1,fe);if(fly.k>=1){fly=null;}}
  var pulse=ledOn?0.85+0.15*Math.sin(t*1.8):0;
  ledMat.color.set(ledOn?0xFFE6BD:0x6B6257);
  glow.visible=ledOn;glow.scale.setScalar(13+2*Math.sin(t*1.8));ledLight.intensity=0.35*pulse;
  controls.update();renderer.render(scene,camera);
}
frame();
})();
